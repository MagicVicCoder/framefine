[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "framerefine"
version = "0.1.0"
description = "Conditional-forest reinforcement learning for query-conditioned video frame compression"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.24", "Pillow>=10", "tomli>=2; python_version<'3.11'"]

[project.optional-dependencies]
features = ["transformers>=4.45,<5", "accelerate>=0.30"]
video = ["opencv-python>=4.8"]
qwen = ["transformers>=4.54,<5", "accelerate>=0.30", "pillow>=10", "torchvision>=0.17", "qwen-vl-utils>=0.0.14,<0.1"]
internvl = ["transformers>=4.37.2,<4.46", "accelerate>=0.30", "timm>=0.9.12,<2", "einops>=0.6", "sentencepiece>=0.1.99", "protobuf>=4"]
# Install the official LLaVA-NeXT checkout separately; its upstream training
# extras have a different torch/transformers stack. Do not install all readers
# into one environment. See README for the supported interface and limitations.
llava = ["transformers>=4.45,<4.46", "accelerate>=0.30", "torchvision>=0.17", "sentencepiece>=0.1.99", "einops>=0.6", "timm>=0.9.12,<2"]

[project.scripts]
framerefine = "framerefine.cli:main"

[tool.setuptools.packages.find]
include = ["framerefine*"]
